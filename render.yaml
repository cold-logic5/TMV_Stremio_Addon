services:
  - type: web
    name: stremio-tamil
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
        - tsconfig.json
        - render.yaml
      ignoredPaths:
        - data/**
        - .github/**
        - "*.md"
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: stremio-tamil 
          type: web
          property: host
      - key: DATA_URL
        value: https://raw.githubusercontent.com/saraV97/TMV_Stremio_Addon/main/data/movies.json
      - key: DATA_REFRESH_MINUTES
        value: 15
      - key: TAMILMV_BASE_URL
        value: https://www.1tamilmv.fi/

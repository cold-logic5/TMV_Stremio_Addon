name: Daily TamilMV Scraper

on:
  schedule:
    # Run once a day at 19:00 UTC (00:30 AM IST, shortly after midnight IST releases)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        env:
          TAMILMV_BASE_URL: ${{ secrets.TAMILMV_BASE_URL || 'https://www.1tamilmv.fi/' }}
          IMDB_API_KEY: ${{ secrets.IMDB_API_KEY }}
          MAX_SCRAPE_LIMIT: ${{ secrets.MAX_SCRAPE_LIMIT || '300' }}
        run: npm run scrape:once

      - name: Commit and push updated data/movies.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          if ! git diff --staged --quiet; then
            echo "New movies found. Committing and pushing..."
            git commit -m "chore: auto-update movies.json catalog [skip ci] [skip render]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in data/movies.json to commit."
          fi

